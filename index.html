<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagi Story Music — 物語を、歌と映像で。</title>
<meta name="description" content="物語・音楽・映像を組み合わせて作品を制作するクリエイター Nagi Story Music のポートフォリオ。オリジナルの物語から生まれた楽曲とミュージックビデオ。">
<meta name="theme-color" content="#121111">
<link rel="canonical" href="https://nagistorymusic.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nagi Story Music">
<meta property="og:title" content="Nagi Story Music — 物語を、歌と映像で。">
<meta property="og:description" content="オリジナルの物語から生まれた楽曲とミュージックビデオ。">
<meta property="og:url" content="https://nagistorymusic.github.io/">
<meta property="og:image" content="https://nagistorymusic.github.io/assets/icons/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@Nagi_storymusic">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="assets/icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/logo/nsm-mark-640.webp" as="image">
<link rel="preload" href="assets/logo/nsm-wordmark-960.webp" as="image"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121111; --ink2: #1c1b1a; --paper: #ebe4d3; --dim: #8f969b;
    --red: #d9533b; --slate: #889ba9;
    --en: 'Cormorant Garamond', serif; --mincho: 'Shippori Mincho', serif; --sans: 'Zen Kaku Gothic New', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--ink); color: var(--paper); scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.9; letter-spacing: .04em; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ---------- 上部ナビ ---------- */
  .nav { position: fixed; inset: 0 0 auto; z-index: 20; display: flex; justify-content: space-between; align-items: center;
         padding: 18px clamp(16px, 4vw, 48px); mix-blend-mode: difference; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; }
  .nav b { display: block; }
  .nav b img { display: block; width: clamp(150px, 16vw, 220px); height: auto; }
  .nav ul { display: flex; gap: clamp(14px, 3vw, 36px); list-style: none; padding: 0; }
  /* 23 隠れるヘッダー：下へスクロールで隠れ、上へ戻すと出る */
  .nav { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
  .nav.is-hidden { transform: translateY(-110%); }

  /* ---------- トップ：シネスコの帯 ---------- */
  .hero { position: relative; height: 100svh; min-height: 520px; overflow: hidden; background: var(--ink); }
  .hero-screen { position: absolute; inset: 0; background: #000; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .82; }
  .hero::before, .hero::after { content: ''; position: absolute; left: 0; right: 0; height: 11vh; background: var(--ink); z-index: 2; }
  .hero::before { top: 0; } .hero::after { bottom: 0; }
  .subtitle { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(11vh + 6vh); text-align: center;
              font-family: var(--mincho); font-weight: 500; font-size: clamp(22px, 3.4vw, 44px); letter-spacing: .14em;
              text-shadow: 0 0 18px rgba(0,0,0,.6); }
  .hero-meta { position: absolute; z-index: 3; bottom: 0; left: 0; right: 0; height: 11vh; display: flex; align-items: center;
               justify-content: space-between; padding: 0 clamp(16px, 4vw, 48px); font-size: 10px; letter-spacing: .32em; color: var(--dim); text-transform: uppercase; }
  .hero-meta em { font-family: var(--en); font-style: italic; font-size: 15px; letter-spacing: .08em; color: var(--paper); text-transform: none; }

  /* 06 ブラーイン + 04 テキストリビール */
  .ch { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(.3em);
        transition: opacity .9s, filter .9s, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 55ms + 300ms); }
  .is-in .ch { opacity: 1; filter: blur(0); transform: none; }
  [data-blur] { opacity: 0; filter: blur(14px); transition: opacity 1.4s, filter 1.4s; }
  [data-blur].is-in { opacity: 1; filter: blur(0); }
  /* 15 背景色トランジション：作品ごとに、照明が変わるようにうっすら染まる */
  #works { background: color-mix(in srgb, var(--tint, var(--ink)) 7%, var(--ink)); transition: background-color 1.6s ease; }

  /* ---------- 作品：上映作品 ---------- */
  section { padding: clamp(80px, 14vw, 180px) clamp(16px, 4vw, 48px); }
  .label { font-size: 10px; letter-spacing: .4em; text-transform: uppercase; color: var(--dim); display: flex; gap: 18px; align-items: center; }
  .label::after { content: ''; flex: 1; height: 1px; background: #2e2c2a; }
  h2 { font-family: var(--en); font-weight: 400; font-style: italic; font-size: clamp(48px, 9vw, 128px); line-height: .95; letter-spacing: -.01em; margin: 24px 0 clamp(56px, 9vw, 120px); }
  .film { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(12px, 2vw, 28px); align-items: end; margin-bottom: clamp(80px, 12vw, 160px); }
  .film .screen { grid-column: 1 / 9; position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; cursor: pointer; }
  .film:nth-child(even) .screen { grid-column: 5 / 13; grid-row: 1; }
  .film:nth-child(even) .info { grid-column: 1 / 5; grid-row: 1; text-align: right; }
  .screen img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.7,.2,1), opacity .6s; opacity: .9; }
  .screen:hover img { transform: scale(1.03); opacity: 1; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* キーセンテンス：タイトルの下 */
  .line { font-family: var(--mincho); font-weight: 500; white-space: pre-line; letter-spacing: .1em; }
  .info .line { font-size: clamp(17px, 1.55vw, 21px); line-height: 2; margin: 22px 0 18px; padding-left: 16px; border-left: 1px solid var(--red); }
  .film:nth-child(even) .info .line { padding: 0 16px 0 0; border-left: 0; border-right: 1px solid var(--red); }
  .screen .play { position: absolute; top: 16px; left: 18px; font-size: 10px; letter-spacing: .35em; color: var(--paper); opacity: .8; }
  .screen .play::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 10px; vertical-align: 1px; }
  .screen.is-playing .play { display: none; }
  .info { grid-column: 9 / 13; padding-bottom: 6px; }
  .info .no { font-family: var(--en); font-size: clamp(56px, 7vw, 96px); line-height: 1; color: var(--red); font-weight: 500; }
  .info h3 { font-family: var(--en); font-style: italic; font-weight: 500; font-size: clamp(26px, 2.8vw, 38px); line-height: 1.15; margin: 10px 0 8px; letter-spacing: .01em; }
  .info h3.jp { font-family: var(--mincho); font-style: normal; font-weight: 700; letter-spacing: .12em; }
  .info small { font-size: 10px; letter-spacing: .32em; color: var(--dim); text-transform: uppercase; }
  .info .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .film:nth-child(even) .info .meta { justify-content: flex-end; }
  .info .yt { font-family: var(--en); font-style: italic; font-size: 16px; letter-spacing: .04em; color: var(--paper);
              border-bottom: 1px solid rgba(217,83,59,.6); padding-bottom: 1px; transition: color .3s, border-color .3s; }
  .info .yt:hover { color: var(--red); border-bottom-color: var(--red); }
  /* 透かしの NSM マーク（作品情報の側の余白に。スクロールで少し遅れて動く＝10 パララックス） */
  .film { isolation: isolate; }
  .film .screen, .film .info { grid-row: 1; }
  .film .wm { grid-column: 9 / 13; grid-row: 1; align-self: center; justify-self: center; width: min(100%, 300px); z-index: -1;
              opacity: .07; pointer-events: none; transform: translateY(var(--py, 0px)); will-change: transform; }
  .film:nth-child(even) .wm { grid-column: 1 / 5; }
  .more { display: inline-block; font-family: var(--en); font-style: italic; font-size: 22px; border-bottom: 1px solid var(--red); padding-bottom: 2px; }

  /* ---------- プロフィール：監督の言葉 ---------- */
  .about { background: var(--ink2); }
  .about .cols { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 6vw, 96px); max-width: 1100px; }
  .about .ja { font-family: var(--mincho); font-size: clamp(16px, 1.5vw, 19px); line-height: 2.3; }
  .about .en { font-family: var(--en); font-style: italic; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.7; color: #c9c2b2; }

  /* ---------- エンドロール ---------- */
  .credits { text-align: center; }
  .credits h2 { margin-bottom: 64px; }
  .roll { list-style: none; padding: 0; display: grid; gap: 22px; margin-bottom: clamp(80px, 12vw, 140px); }
  .roll li { display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: baseline; }
  .roll span { text-align: right; font-size: 10px; letter-spacing: .4em; color: var(--dim); text-transform: uppercase; }
  .roll a { text-align: left; font-family: var(--en); font-size: clamp(22px, 2.6vw, 32px); font-style: italic; transition: color .3s; }
  .roll a:hover { color: var(--red); }
  .roll i { width: 40px; height: 1px; background: #3a3734; align-self: center; }
  /* フォームを、うっすらした細い枠で囲む（上辺の中央に小さな見出し） */
  form { position: relative; max-width: 620px; margin: 0 auto; text-align: left; display: grid; gap: 26px;
         border: 1px solid rgba(235,228,211,.14); padding: clamp(36px, 5vw, 56px) clamp(20px, 5vw, 52px) clamp(28px, 4vw, 44px); }
  form::before { content: 'Contact'; position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); padding: 0 14px;
                 background: var(--ink); font-family: var(--en); font-style: italic; font-size: 15px; letter-spacing: .12em; color: var(--dim); }
  label { display: grid; gap: 6px; font-size: 10px; letter-spacing: .32em; color: var(--dim); }
  input, select, textarea { font: inherit; font-size: 15px; color: var(--paper); background: transparent; border: 0; border-bottom: 1px solid #3a3734; padding: 8px 0; outline: none; letter-spacing: .04em; }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--red); }
  select option { background: var(--ink); }
  textarea { min-height: 110px; resize: vertical; }
  button { justify-self: center; font-family: var(--en); font-style: italic; font-size: 22px; color: var(--paper); background: none; border: 1px solid var(--paper);
           padding: 10px 48px; cursor: pointer; transition: background .3s, color .3s; }
  button:hover { background: var(--paper); color: var(--ink); }
  button:disabled { opacity: .5; cursor: wait; }
  .form-status { justify-self: center; min-height: 1.9em; font-size: 13px; letter-spacing: .08em; color: var(--dim); text-align: center; }
  .form-status.is-ok { color: var(--paper); } .form-status.is-ng { color: var(--red); }
  .hp { position: absolute; left: -9999px; }
  .totop { text-align: center; padding-top: clamp(40px, 6vw, 72px); }
  .totop a { font-family: var(--en); font-style: italic; font-size: 20px; color: var(--dim); border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .totop a:hover { color: var(--paper); border-bottom-color: var(--red); }
  footer { text-align: center; padding: 48px 16px 64px; font-size: 10px; letter-spacing: .4em; color: var(--dim); }

  .bairt { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; filter: drop-shadow(0 0 14px rgba(217,83,59,.25)); }

  /* ---------- オープニング：ロゴ → グリッチ → NAGI STORY MUSIC → 左上へ ---------- */
  .intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; pointer-events: none; }
  .intro::before { content: ''; position: absolute; inset: 0; background: var(--ink); transition: opacity .8s .2s; }
  .intro.is-out::before { opacity: 0; }
  .intro > * { grid-area: 1 / 1; position: relative; }
  .intro img { display: block; width: 100%; height: auto; }
  .intro-mark { width: clamp(150px, 20vw, 260px); opacity: 0; transform: scale(1.08); transition: opacity .7s, transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .intro-mark.is-on { opacity: 1; transform: none; }
  .intro-word { width: clamp(260px, 46vw, 640px); opacity: 0; transform-origin: 0 0; }
  .intro-word.is-on { opacity: 1; }
  .intro-word.is-fly { transition: transform .8s cubic-bezier(.7,0,.2,1); }
  /* グリッチ：ロゴの形で切り抜いた朱と青緑の複製を、横に切って揺らす */
  .gl { position: relative; }
  .gl::before, .gl::after { content: ''; position: absolute; inset: 0; opacity: 0; pointer-events: none;
                            -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .gl::before { background: var(--red); }
  .gl::after { background: #5fd3d0; }
  .gl.is-glitch { animation: gl-jit .5s steps(2) both; }
  .gl.is-glitch::before { opacity: .9; animation: gl-cut .5s steps(1) infinite; }
  .gl.is-glitch::after { opacity: .9; animation: gl-cut .5s steps(1) infinite reverse; }
  @keyframes gl-cut {
    0% { clip-path: inset(8% 0 78% 0); transform: translate(-7px, 1px); }
    17% { clip-path: inset(58% 0 22% 0); transform: translate(6px, -1px); }
    33% { clip-path: inset(30% 0 52% 0); transform: translate(-4px, 0); }
    50% { clip-path: inset(80% 0 4% 0); transform: translate(8px, 1px); }
    67% { clip-path: inset(2% 0 88% 0); transform: translate(-5px, 0); }
    83% { clip-path: inset(44% 0 38% 0); transform: translate(3px, -1px); }
  }
  @keyframes gl-jit {
    0% { transform: translate(0); clip-path: inset(0); } 25% { transform: translate(-2px, 1px); clip-path: inset(0 0 12% 0); }
    50% { transform: translate(3px, -1px); clip-path: inset(18% 0 0 0); } 75% { transform: translate(-1px, 0); clip-path: inset(0 0 30% 0); }
    100% { transform: translate(0); clip-path: inset(0); }
  }
  .nav b { transition: opacity .3s; }
  .is-intro .nav b { opacity: 0; }

  @media (max-width: 760px) {
    .nav ul { display: none; }
    .film, .film:nth-child(even) { grid-template-columns: 1fr; }
    .film .screen, .film:nth-child(even) .screen, .info, .film:nth-child(even) .info { grid-column: 1; grid-row: auto; text-align: left; }
    .film:nth-child(even) .info .line { padding: 0 0 0 16px; border-right: 0; border-left: 1px solid var(--red); }
    .film .wm { display: none; }
    .about .cols { grid-template-columns: 1fr; }
    .roll li { grid-template-columns: 1fr; gap: 2px; } .roll span, .roll a { text-align: center; } .roll i { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ch, [data-blur] { transition: none; opacity: 1; filter: none; transform: none; }
    .nav { transition: none; }
  }
</style>
</head>
<body id="top">
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-mark gl" style="--src: url(assets/logo/nsm-mark-640.webp)"><img src="assets/logo/nsm-mark-640.webp" alt=""></div>
  <div class="intro-word gl" style="--src: url(assets/logo/nsm-wordmark-960.webp)"><img src="assets/logo/nsm-wordmark-960.webp" alt=""></div>
</div>
<nav class="nav"><b><a href="#top" aria-label="Nagi Story Music（ページの一番上へ）"><img src="assets/logo/nsm-wordmark-960.webp" alt="Nagi Story Music"></a></b><ul><li><a href="#works">Works</a></li><li><a href="#about">Profile</a></li><li><a href="#contact">Contact</a></li></ul></nav>

<header class="hero">
  <div class="hero-screen"><video id="reel" autoplay muted loop playsinline poster="assets/showreel/showreel-poster-1080.jpg"></video></div>
  <p class="subtitle" data-reveal data-split>物語を、歌と映像で。</p>
  <div class="hero-meta"><span>Now Showing — 6 Films</span><em>a story, in song and film</em><span>Scroll</span></div>
</header>

<section id="works">
  <p class="label">Program</p>
  <h2 data-blur data-reveal>Now Showing</h2>
  <div id="films"></div>
  <p style="text-align:center"><a class="more" href="https://www.youtube.com/@Nagi-Story-Music/videos" target="_blank" rel="noopener">More films on YouTube →</a></p>
</section>

<section id="about" class="about">
  <p class="label">Director's note</p>
  <h2 data-blur data-reveal>Nagi</h2>
  <div class="cols"><p class="ja" data-blur data-reveal id="pja"></p><p class="en" data-blur data-reveal id="pen"></p></div>
</section>

<section id="contact" class="credits">
  <p class="label">End credits</p>
  <h2 data-blur data-reveal>Credits</h2>
  <ul class="roll" id="roll"></ul>
  <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
    <!-- Web3Forms の送り先キー（公開してよい値） -->
    <input type="hidden" name="access_key" value="63e37a2a-b743-4140-91e3-05309424adce">
    <input type="hidden" name="subject" value="【Nagi Story Music】サイトからのお問い合わせ">
    <input type="hidden" name="from_name" value="Nagi Story Music サイト">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>お名前<input name="name" autocomplete="name" required></label>
    <label>メールアドレス<input name="email" type="email" autocomplete="email" required></label>
    <label>ご依頼の種類<select name="request"><option>MV制作</option><option>作曲</option><option>その他</option></select></label>
    <label>内容<textarea name="message" required></textarea></label>
    <button>Send</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>
<p class="totop"><a href="#top">↑ Back to top</a></p>
<footer>© Nagi Story Music</footer>

<script src="assets/js/site.js"></script>
<script>
  const { works, links, profile } = NSM;
  // スマホは 720p、PC は 1080p、大きい画面・高精細な画面は 1440p
  const phone = innerWidth < 760 || matchMedia('(pointer: coarse)').matches;
  const px = innerWidth * (devicePixelRatio || 1);
  const res = phone ? 720 : px > 1900 ? 1440 : 1080;
  document.getElementById('reel').innerHTML = ['webm', 'mp4'].map((ext) =>
    `<source src="assets/showreel/showreel-${res}.${ext}" type="video/${ext}">`).join('');
  document.getElementById('films').innerHTML = works.map((w, i) => `
    <article class="film">
      <img class="wm" src="assets/logo/nsm-mark-640.webp" alt="" loading="lazy">
      <div class="screen" data-avoid data-id="${w.id}" data-blur data-reveal>
        <img src="${NSM.localThumb(w.id).src}" srcset="${NSM.localThumb(w.id).srcset}" sizes="(max-width: 760px) 92vw, 62vw" alt="${w.title}" loading="lazy" decoding="async">
        <span class="play">Play</span>
      </div>
      <div class="info" data-blur data-reveal>
        <div class="no">${String(i + 1).padStart(2, '0')}</div>
        <h3 class="${/[^\x00-\x7F]/.test(w.title) ? 'jp' : ''}">${w.title}</h3>
        <p class="line" data-split>${w.line}</p>
        <p class="meta"><small>${w.kind || 'Official MV'}</small><a class="yt" href="https://www.youtube.com/watch?v=${w.id}" target="_blank" rel="noopener" aria-label="${w.title} を YouTube で見る（新しいタブ）">Watch on YouTube ↗</a></p>
      </div>
    </article>`).join('');
  document.querySelectorAll('.screen').forEach((s) => NSM.facade(s, s.dataset.id));
  document.getElementById('pja').textContent = profile.ja;
  document.getElementById('pen').textContent = profile.en;
  document.getElementById('roll').innerHTML = links.map(([n, u]) => `<li><span>${n}</span><i></i><a href="${u}" target="_blank" rel="noopener">${u.replace(/^https:\/\/(www\.)?/, '')}</a></li>`).join('');
  document.querySelectorAll('[data-split]').forEach(NSM.split);
  // 透かしマークのパララックス
  const marks = [...document.querySelectorAll('.film .wm')];
  if (!NSM.reduced) {
    const onScroll = () => marks.forEach((m) => {
      const r = m.parentElement.getBoundingClientRect();
      m.style.setProperty('--py', `${(r.top + r.height / 2 - innerHeight / 2) * -0.15}px`);
    });
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  // 15 作品ごとの照明の色（背景に 7% だけ混ぜる）
  const tints = ['#e0782e', '#c9a35a', '#3f6fd8', '#c4473a', '#8a9aa8', '#4f8fb0'];
  const worksEl = document.getElementById('works');
  const tio = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) worksEl.style.setProperty('--tint', tints[[...e.target.parentElement.children].indexOf(e.target)]);
  }), { rootMargin: '-45% 0px -45% 0px' });
  document.querySelectorAll('.film').forEach((f) => tio.observe(f));

  // お問い合わせ：Web3Forms へ送信し、ページを移動せずに結果を表示
  const form = document.getElementById('contact-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button'), status = form.querySelector('.form-status');
    btn.disabled = true; status.className = 'form-status'; status.textContent = '送信しています…';
    try {
      const res = await fetch(form.action, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || res.status);
      form.reset();
      status.classList.add('is-ok'); status.textContent = '送信しました。ありがとうございます。お返事までしばらくお待ちください。';
      btn.textContent = 'Thank you';
    } catch (err) {
      status.classList.add('is-ng'); status.textContent = '送信できませんでした。時間をおいてもう一度お試しいただくか、X の DM からご連絡ください。';
      btn.disabled = false;
    }
  });

  // 23 ナビの出し入れ
  const nav = document.querySelector('.nav');
  let lastY = scrollY, ticking = false;
  const onFrame = () => {
    ticking = false;
    const dy = scrollY - lastY;
    if (Math.abs(dy) > 4) { nav.classList.toggle('is-hidden', dy > 0 && scrollY > 160); lastY = scrollY; }
  };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onFrame); } }, { passive: true });
  // ナビのリンクを押したら、ナビは出したまま
  nav.addEventListener('focusin', () => nav.classList.remove('is-hidden'));

  // オープニング（1回の訪問につき1回。?intro=1 で毎回再生）
  const intro = document.getElementById('intro');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let seen = false;
  try { seen = sessionStorage.getItem('nsm-intro') === '1'; sessionStorage.setItem('nsm-intro', '1'); } catch (e) {}
  if (new URLSearchParams(location.search).has('intro')) seen = false;
  async function playIntro() {
    const mark = intro.querySelector('.intro-mark'), word = intro.querySelector('.intro-word');
    const reel = document.getElementById('reel');
    reel.autoplay = false; reel.pause();  // オープニング中は止めておく
    document.documentElement.classList.add('is-intro');
    await wait(200);  mark.classList.add('is-on');
    await wait(1300); mark.classList.add('is-glitch');
    await wait(450);  mark.classList.remove('is-on'); word.classList.add('is-on', 'is-glitch');
    await wait(1000);
    // 左上のロゴ位置へ縮みながら移動
    const from = word.getBoundingClientRect(), to = document.querySelector('.nav b').getBoundingClientRect();
    const s = to.width / from.width;
    word.classList.remove('is-glitch'); word.classList.add('is-fly');
    word.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${s})`;
    // 幕が開く瞬間に頭から（タブが裏にあって再生できなければ、戻ってきた時に再生）
    reel.currentTime = 0;
    reel.play().catch(() => addEventListener('focus', () => reel.play().catch(() => {}), { once: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden && reel.paused) reel.play().catch(() => {}); });
    intro.classList.add('is-out');
    await wait(800);
    document.documentElement.classList.remove('is-intro');
    await wait(150);  intro.remove();
  }
  if (seen || NSM.reduced) { intro.remove(); NSM.reveal(); }
  else { playIntro().then(() => NSM.reveal()); }
  NSM.mascot({ src: 'assets/mascot/bairt-front.png', mode: 'follow', size: 42, tapToTop: true });
</script>
</body>
